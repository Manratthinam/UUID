name: CI / CD Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# ── Global env ────────────────────────────────────────────────────────────────
env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'UUID.sln'
  TEST_PROJECT: 'UUID.Tests/UUID.Tests.csproj'
  IMAGE_NAME: uuid-app          # change to your Docker Hub image name
  SONAR_PROJECT_KEY: 'Manratthinam_UUID'
  SONAR_ORGANIZATION: 'manratthinam'

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 – Build, Test & SonarCloud Quality Gate (coverage ≥ 80%)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build, Test & SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Full git history — required by SonarCloud for accurate blame/new-code data
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 17 — required by dotnet-sonarscanner internally
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      # 3. .NET SDK
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 4. Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 5. Cache SonarCloud scanner packages (speeds up scanner download)
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 6. Install dotnet-sonarscanner global tool
      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      # 7. Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # 8. Begin SonarCloud analysis
      #    sonar.qualitygate.wait=true → this step FAILS if Quality Gate fails (coverage < 80%)
      #    which blocks the Docker deployment job from running
      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**Tests*/**" \
            /d:sonar.qualitygate.wait=true

      # 9. Build solution
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      # 10. Run NUnit tests — OpenCover format is required by SonarCloud
      - name: Run tests with coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # 11. End SonarCloud analysis — uploads results and waits for Quality Gate
      #     ❌ Job FAILS here if coverage < 80% → Docker deployment is BLOCKED
      #     ✅ Job continues if coverage ≥ 80% → Docker deployment proceeds
      - name: End SonarCloud analysis (Quality Gate check)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # 12. Upload test results artifact (always — useful for debugging failures)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 – Docker Build & Push
  #   Only runs if Job 1 passes (SonarCloud Quality Gate ≥ 80% coverage)
  #   Only runs on push to main (not PRs)
  #   Requires secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    # NOTE: secrets context is not allowed in job-level if — guard is on the step below
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HAS_DOCKER_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to Docker Hub — skipped if secrets are not configured
      - name: Log in to Docker Hub
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker secrets not configured (skipped)
        if: env.HAS_DOCKER_SECRETS != 'true'
        run: echo "⚠️ Docker push skipped — add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to enable it."
