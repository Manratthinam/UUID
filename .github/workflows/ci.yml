name: CI / CD Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# ── Global env ────────────────────────────────────────────────────────────────
env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'UUID.sln'
  TEST_PROJECT: 'UUID.Tests/UUID.Tests.csproj'
  IMAGE_NAME: uuid-app          # change to your Docker Hub image name
  COVERAGE_THRESHOLD: 80        # minimum % required to proceed to Docker deployment

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 – Build & Test
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet: ['9.0.x']   # add more versions here if you ever need a matrix

    steps:
      # 1. Check out source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up .NET SDK
      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      # 3. Cache NuGet packages (speeds up subsequent runs)
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # 5. Build (fail fast on warnings treated as errors)
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      # 6. Run NUnit tests with code coverage
      - name: Run tests
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      # 7. Enforce coverage threshold — blocks Docker deployment if below 80%
      - name: Check code coverage (≥ ${{ env.COVERAGE_THRESHOLD }}%)
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, glob, sys, os

          threshold = int(os.environ.get('COVERAGE_THRESHOLD', 80))

          files = glob.glob('./**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('❌ No coverage.cobertura.xml found — make sure XPlat Code Coverage ran.')
              sys.exit(1)

          root = ET.parse(files[0]).getroot()
          line_rate  = float(root.get('line-rate',  0)) * 100
          branch_rate = float(root.get('branch-rate', 0)) * 100

          print(f'━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
          print(f'📊 Line Coverage   : {line_rate:.1f}%')
          print(f'📊 Branch Coverage : {branch_rate:.1f}%')
          print(f'🎯 Required        : {threshold}%')
          print(f'━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')

          if line_rate < threshold:
              print(f'❌ FAILED — Line coverage {line_rate:.1f}% is below {threshold}% threshold.')
              print(f'   Docker deployment is BLOCKED until coverage improves.')
              sys.exit(1)

          print(f'✅ PASSED — Coverage {line_rate:.1f}% meets the {threshold}% threshold.')
          print(f'   Proceeding to Docker deployment.')
          EOF

      # 8. Upload test results as artifact (always, even on failure)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # always upload even on failure, useful for debugging
        with:
          name: test-results
          path: '**/TestResults/**'
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 – Docker Build & Push
  #   Runs only on pushes to main (not on PRs)
  #   Requires secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test          # only runs if tests pass
    # NOTE: secrets context is not allowed in job-level if — guard is on the step below
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HAS_DOCKER_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to Docker Hub — skipped if secrets are not configured
      - name: Log in to Docker Hub
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push using Docker Buildx (supports multi-platform if needed)
      - name: Set up Docker Buildx
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.HAS_DOCKER_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker secrets not configured (skipped)
        if: env.HAS_DOCKER_SECRETS != 'true'
        run: echo "⚠️ Docker push skipped — add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to enable it."
